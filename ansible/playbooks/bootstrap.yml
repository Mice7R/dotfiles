---
- hosts: all
  gather_facts: true
  vars:
    bootstrap_tmp: "{{ ansible_facts.env.HOME }}/.cache/dotifles/"
    just:
      url: "https://github.com/casey/just/releases/download/1.56.0/just-1.56.0-x86_64-unknown-linux-musl.tar.gz"
      hash: "sha256:fa2a8ec1015d9df5330941ade12437488fc40d33f9c9f8cd4eb70a26de11b639"
    chezmoi:
      url: "https://github.com/twpayne/chezmoi/releases/download/v2.71.0/chezmoi-linux-amd64"
      hash: "sha256:2a051bb2a6f231b727834f11f0e5b45b7253983ca0012824fc9bc5132b39611e"

  tasks:
    - name: Create bin folder
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin"
        state: directory
        mode: "0700"
    - name: Create man folder
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/man/man1/"
        state: directory
        mode: "0700"
    - name: Create bootstrap temp folder
      ansible.builtin.file:
        path: "{{ bootstrap_tmp }}"
        state: directory
        mode: "0700"

    - name: Create just extraction folder
      ansible.builtin.file:
        path: "{{ bootstrap_tmp }}/just"
        state: directory
        mode: "0700"

    - name: Download just archive
      ansible.builtin.get_url:
        url: "{{ just.url }}"
        dest: "{{ bootstrap_tmp }}/just.tar.gz"
        checksum: "{{ just.hash }}"
        mode: "0600"

    - name: Extract just archive
      ansible.builtin.unarchive:
        src: "{{ bootstrap_tmp }}/just.tar.gz"
        dest: "{{ bootstrap_tmp }}/just"
        remote_src: true
        creates: "{{ bootstrap_tmp }}/just/just"

    - name: Install just binary
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/just/just"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/just"
        remote_src: true
        mode: "0500"

    - name: Install just man page
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/just/just.1"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/man/man1/just.1"
        remote_src: true
        mode: "0400"

    - name: Download chezmoi binary
      ansible.builtin.get_url:
        url: "{{ chezmoi.url }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/chezmoi"
        checksum: "{{ chezmoi.hash }}"
        mode: "0500"
