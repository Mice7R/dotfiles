---
- hosts: all
  gather_facts: true
  vars:
    bootstrap_tmp: "{{ ansible_facts.env.HOME }}/.cache/dotfiles/"
    install_prefix: "{{ ansible_facts.user_dir }}/.local"
    just:
      url: "https://github.com/casey/just/releases/download/1.56.0/just-1.56.0-x86_64-unknown-linux-musl.tar.gz"
      hash: "sha256:fa2a8ec1015d9df5330941ade12437488fc40d33f9c9f8cd4eb70a26de11b639"
    chezmoi:
      url: "https://github.com/twpayne/chezmoi/releases/download/v2.71.0/chezmoi-linux-amd64"
      hash: "sha256:2a051bb2a6f231b727834f11f0e5b45b7253983ca0012824fc9bc5132b39611e"
    uv:
      url: "https://github.com/astral-sh/uv/releases/download/0.11.28/uv-x86_64-unknown-linux-gnu.tar.gz"
      hash: "sha256:e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224"
    gum:
      url: "https://github.com/charmbracelet/gum/releases/download/v0.17.0/gum_0.17.0_Linux_x86_64.tar.gz"
      hash: "sha256:69ee169bd6387331928864e94d47ed01ef649fbfe875baed1bbf27b5377a6fdb"

  tasks:
    - name: Make directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ install_prefix }}/share/man/man1/"
        - "{{ bootstrap_tmp }}"
        - "{{ bootstrap_tmp }}/just"

    - name: Download just archive
      ansible.builtin.get_url:
        url: "{{ just.url }}"
        dest: "{{ bootstrap_tmp }}/just.tar.gz"
        checksum: "{{ just.hash }}"
        mode: "0600"

    - name: Extract just archive
      ansible.builtin.unarchive:
        src: "{{ bootstrap_tmp }}/just.tar.gz"
        dest: "{{ bootstrap_tmp }}/just"
        remote_src: true
        creates: "{{ bootstrap_tmp }}/just/just"

    - name: Install just binary
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/just/just"
        dest: "{{ install_prefix }}/bin/just"
        remote_src: true
        mode: "0500"

    - name: Install just man page
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/just/just.1"
        dest: "{{ install_prefix }}/share/man/man1/just.1"
        remote_src: true
        mode: "0400"

    - name: Download chezmoi binary
      ansible.builtin.get_url:
        url: "{{ chezmoi.url }}"
        dest: "{{ install_prefix }}/bin/chezmoi"
        checksum: "{{ chezmoi.hash }}"
        mode: "0500"

    - name: Create uv extraction folder
      ansible.builtin.file:
        path: "{{ bootstrap_tmp }}/uv"
        state: directory
        mode: "0700"

    - name: Download uv archive
      ansible.builtin.get_url:
        url: "{{ uv.url }}"
        dest: "{{ bootstrap_tmp }}/uv.tar.gz"
        checksum: "{{ uv.hash }}"
        mode: "0600"

    - name: Extract uv archive
      ansible.builtin.unarchive:
        src: "{{ bootstrap_tmp }}/uv.tar.gz"
        dest: "{{ bootstrap_tmp }}/uv"
        remote_src: true
        creates: "{{ bootstrap_tmp }}/uv/uv-x86_64-unknown-linux-gnu/uv"

    - name: Install uv binary
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/uv/uv-x86_64-unknown-linux-gnu/uv"
        dest: "{{ install_prefix }}/bin/uv"
        remote_src: true
        mode: "0500"

    - name: Install uvx binary
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/uv/uv-x86_64-unknown-linux-gnu/uvx"
        dest: "{{ install_prefix }}/bin/uvx"
        remote_src: true
        mode: "0500"

    - name: Download gum
      ansible.builtin.get_url:
        url: "{{ gum.url }}"
        dest: "{{ bootstrap_tmp }}/gum.tar.gz"
        checksum: "{{ gum.hash }}"
        mode: "0600"

    - name: Extract gum archive
      ansible.builtin.unarchive:
        src: "{{ bootstrap_tmp }}/gum.tar.gz"
        dest: "{{ bootstrap_tmp }}/"
        remote_src: true
        creates: "{{ bootstrap_tmp }}/gum/gum_0.17.0_Linux_x86_64/gum"

    - name: Install gum binary
      ansible.builtin.copy:
        src: "{{ bootstrap_tmp }}/gum_0.17.0_Linux_x86_64/gum"
        dest: "{{ install_prefix }}/bin/gum"
        remote_src: true
        mode: "0500"
